[package]
name = "copytrade"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "copytrade"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.52", features = ["full"] }
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bs58 = "0.5"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
anyhow = "1"
thiserror = "2"

[dev-dependencies]
sha2 = "0.11"
tempfile = "3"
