[package]
name = "copytrade"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "copytrade"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.52", features = ["full"] }
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bs58 = "0.5"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
anyhow = "1"
thiserror = "2"
# Solana SDK — transaction building and submission
solana-sdk = "2.2"
solana-client = "2.2"
solana-program = "2.2"
solana-transaction = "2.2"
spl-token = "7"
spl-associated-token-account = "6"
# Keypair management
dirs = "6"
# Jito bundle submission
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.22"
bincode = "1.3"

[dev-dependencies]
sha2 = "0.11"
tempfile = "3"
